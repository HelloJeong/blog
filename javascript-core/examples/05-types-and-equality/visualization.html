<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05. Types & Equality</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./visualization.css" />
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 id="headerTitle" class="text-lg font-bold text-white"></h1>
      <p id="headerDesc" class="text-sm text-gray-400 mt-1"></p>
    </div>
    <div class="lang-btn-group" role="group" aria-label="언어 전환">
      <button id="btnLangKo" class="lang-btn active" onclick="handleLangSwitch('ko')" aria-pressed="true">KO</button>
      <button id="btnLangEn" class="lang-btn" onclick="handleLangSwitch('en')" aria-pressed="false">EN</button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col lg:flex-row gap-0 overflow-hidden">

    <!-- Left: Example list + selected expression -->
    <section class="lg:w-1/2 flex flex-col border-r border-gray-800 overflow-auto">

      <!-- Example list -->
      <div class="flex items-center px-4 py-2 border-b border-gray-800 bg-gray-900/60">
        <span id="listLabel" class="text-xs text-gray-500"></span>
        <span id="listHint" class="ml-auto text-[10px] text-gray-600"></span>
      </div>
      <div id="exampleList" class="px-4 py-3 flex flex-col gap-2 border-b border-gray-800"></div>

      <!-- Selected expression -->
      <div class="flex items-center px-4 py-2 border-b border-gray-800 bg-gray-900/60">
        <span id="exprLabel" class="text-xs text-gray-500"></span>
        <span id="exprBadge" class="ml-auto text-[10px] text-gray-500 mono"></span>
      </div>
      <div class="px-6 py-6 flex-1 flex items-center justify-center">
        <div id="expression" class="expression-box"></div>
      </div>
    </section>

    <!-- Right: Visualization Panel -->
    <section class="lg:w-1/2 flex flex-col overflow-auto">

      <!-- Algorithm flowchart -->
      <div class="flex items-center px-4 py-2 border-b border-gray-800 bg-gray-900/60">
        <span id="flowLabel" class="text-xs text-gray-500"></span>
        <span id="flowHint" class="ml-auto text-[10px] text-gray-600"></span>
      </div>
      <div id="flowchart" class="px-6 py-4 flex flex-col gap-2 border-b border-gray-800"></div>

      <!-- Conversion steps -->
      <div class="flex items-center px-4 py-2 border-b border-gray-800 bg-gray-900/60">
        <span id="stepsLabel" class="text-xs text-gray-500"></span>
      </div>
      <div id="steps" class="px-6 py-4 flex flex-col gap-2 border-b border-gray-800 min-h-[80px]"></div>

      <!-- Results comparison -->
      <div class="flex items-center px-4 py-2 border-b border-gray-800 bg-gray-900/60">
        <span id="resultsLabel" class="text-xs text-gray-500"></span>
      </div>
      <div id="results" class="px-6 py-4 flex flex-col gap-2 border-b border-gray-800"></div>

      <!-- Description -->
      <div class="px-6 py-4 flex-1">
        <div id="description" class="rounded-lg bg-gray-900/80 border border-gray-800 p-4 text-sm text-gray-300 leading-relaxed min-h-[80px]"></div>
      </div>
    </section>
  </main>

  <script src="./visualization.js"></script>
</body>
</html>
